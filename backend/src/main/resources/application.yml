server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

groq:
  api-key: ${GROQ_API_KEY}
  model: llama-3.3-70b-versatile
  api-url: https://api.groq.com/openai/v1/chat/completions
management:
  endpoints:
    web:
      exposure:
        include: "*"
